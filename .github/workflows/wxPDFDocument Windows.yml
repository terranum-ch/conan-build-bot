name: wxPDFDocument Windows Build

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  WXPDFDOCUMENT_VERSION: "1.4.0"
  CONAN_PROFILE: windows-x86_64-msvc194-release
  CONAN_NON_INTERACTIVE: "1"
  # Package registry of terranum-conan/wxwidgets (project ID 33297719).
  GITLAB_CONAN_URL: https://gitlab.com/api/v4/projects/33297719/packages/conan

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Conan 2 and repository profiles
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2,<3"
          conan config install https://gitlab.com/terranum-conan/conan-profile.git
          conan profile show -pr:h="$CONAN_PROFILE" -pr:b="$CONAN_PROFILE"

      - name: Configure GitLab package registry
        env:
          CONAN_LOGIN_USERNAME_GITLAB: ta-lu-cien
          CONAN_PASSWORD_GITLAB: ${{ secrets.GITLAB_UPLOAD_PWD }}
        run: |
          conan remote add gitlab "$GITLAB_CONAN_URL" --force
          conan remote login gitlab "$CONAN_LOGIN_USERNAME_GITLAB" -p "$CONAN_PASSWORD_GITLAB"

      - name: Download wxPDFDocument Conan 2 recipe
        run: git clone --depth 1 https://gitlab.com/terranum-conan/wxpdfdocument.git wxpdfdocument

      - name: Build and test wxPDFDocument
        working-directory: wxpdfdocument
        run: |
          conan create . \
            --version="$WXPDFDOCUMENT_VERSION" \
            --user=terranum-conan \
            --channel=stable \
            --build=missing \
            -pr:h="$CONAN_PROFILE" \
            -pr:b="$CONAN_PROFILE"

      - name: Upload wxPDFDocument recipe and binaries to GitLab
        env:
          CONAN_LOGIN_USERNAME_GITLAB: ta-lu-cien
          CONAN_PASSWORD_GITLAB: ${{ secrets.GITLAB_UPLOAD_PWD }}
        run: conan upload "wxpdfdocument/$WXPDFDOCUMENT_VERSION@terranum-conan/stable" --remote=gitlab --confirm
